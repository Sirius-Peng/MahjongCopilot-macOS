name: Build macOS app
on:
  workflow_dispatch:
  push:
    tags: ["v*-macos.*"]
permissions:
  contents: write
jobs:
  build-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos.txt
      - name: Build app bundle
        run: PYTHON=python scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MahjongCopilot-macOS-arm64
          path: |
            dist/MahjongCopilot-macOS-arm64.zip
            dist/MahjongCopilot-macOS-arm64.zip.sha256
      - name: Attach tagged builds to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" --clobber dist/MahjongCopilot-macOS-arm64.zip dist/MahjongCopilot-macOS-arm64.zip.sha256
